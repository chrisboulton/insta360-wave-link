[package]
name = "insta360-wave"
version = "0.1.0"
edition = "2024"
description = "USB HID controls for the Insta360 Wave"
publish = false

[[bin]]
name = "wave"
path = "src/main.rs"

[dependencies]
aes = "0.8.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = "2.6"
rust-ini = "0.21"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
